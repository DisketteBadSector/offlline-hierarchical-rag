[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-rag"
version = "0.2.0"
description = "Offline Hierarchical RAG Core with Domain-Driven Design (DDD) for Organizational Knowledge, Issue Modeling, and Knowledge Transfer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Offline Hierarchical RAG Team" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml",
    "requests",
    "python-docx",
    "pypdf",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["offline_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
