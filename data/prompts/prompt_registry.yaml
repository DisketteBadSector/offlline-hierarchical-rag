# رجیستری مرکزی و نسخه‌بندی قالب‌های پرامپت (۱۲ دسته وظیفه استاندارد هسته RAG آفلاین)
# هیچ پرامپتی در کدهای پایتون هاردکد نمی‌شود و تمامی قالب‌ها از این رجیستری بارگذاری می‌شوند.

registryVersion: "1.0.0"
lastUpdated: "2026-10-29"
defaultJudgeRubricId: "RUBRIC-DEFAULT-20"

activePrompts:
  qa:
    promptId: "PRM-QA"
    activeVersion: "1.0.0"
  technical_summary:
    promptId: "PRM-TECH-SUM"
    activeVersion: "1.0.0"
  executive_managerial_summary:
    promptId: "PRM-EXEC-SUM"
    activeVersion: "1.0.0"
  issue_decomposition:
    promptId: "PRM-ISSUE-DEC"
    activeVersion: "1.0.0"
  sub_issue_comparison:
    promptId: "PRM-SUBISSUE-CMP"
    activeVersion: "1.0.0"
  executor_expertise_analysis:
    promptId: "PRM-EXEC-ANL"
    activeVersion: "1.0.0"
  research_gap_identification:
    promptId: "PRM-GAP-ID"
    activeVersion: "1.0.0"
  knowledge_transfer_prep:
    promptId: "PRM-TRANSFER-PREP"
    activeVersion: "1.0.0"
  rfp_generation:
    promptId: "PRM-RFP-GEN"
    activeVersion: "1.0.0"
  proposal_evaluation:
    promptId: "PRM-PROP-EVAL"
    activeVersion: "1.0.0"
  feedback_generation:
    promptId: "PRM-FEEDBACK-GEN"
    activeVersion: "1.0.0"
  llm_as_judge:
    promptId: "PRM-JUDGE"
    activeVersion: "1.0.0"

prompts:
  - promptId: "PRM-QA"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "qa"
    targetModelId: "diba-base"
    systemTemplate: "تو دستیار پرسش‌وپاسخ مبتنی بر منبع در هسته RAG سلسله‌مراتبی آفلاین هستی. فقط بر اساس قطعات دانش مجاز گره پاسخ بده و در صورت کمبود دانش، عدم قطعیت را صریح اعلام کن."
    userTemplate: "محدوده گره: {{node_scope}}\nزمینه بازیابی‌شده:\n{{context}}\n\nپرسش کاربر:\n{{query}}"
    requiredVariables:
      - "node_scope"
      - "context"
      - "query"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "answer"
        - "source_references"
        - "uncertainty_declared"
        - "uncertainty_reason"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-DEFAULT-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-15"
        systemTemplate: "تو دستیار پاسخ‌گویی آفلاین هستی. بر اساس متن داده شده به پرسش پاسخ بده."
        userTemplate: "زمینه:\n{{context}}\nپرسش:\n{{query}}"
        requiredVariables:
          - "context"
          - "query"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "answer"
            - "source_references"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-DEFAULT-20"
        changeNote: "نسخه اولیه پیش از افزودن متغیر node_scope و سیاست سخت‌گیرانه ارجاع منبع"

  - promptId: "PRM-TECH-SUM"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "technical_summary"
    targetModelId: "diba-base"
    systemTemplate: "تو تحلیلگر ارشد فنی در هسته RAG آفلاین هستی. دانش فنی گره را با حفظ روش‌ها، نتایج پژوهشی، محدودیت‌ها و توانمندی مجریان خلاصه کن."
    userTemplate: "گره مبدأ: {{node_id}}\nسطح جزئیات هدف: {{detail_level}}\nحداکثر طول مجاز: {{max_length}}\nمحتوای اسناد فنی:\n{{source_content}}"
    requiredVariables:
      - "node_id"
      - "detail_level"
      - "max_length"
      - "source_content"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "methods"
        - "research_results"
        - "limitations"
        - "executor_capabilities"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-TECH-SUMMARY-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-15"
        systemTemplate: "تو خلاصه‌ساز متون فنی هستی."
        userTemplate: "متن فنی گره {{node_id}} را خلاصه کن:\n{{source_content}}"
        requiredVariables:
          - "node_id"
          - "source_content"
        expectedOutputFormat:
          format: "markdown"
          requiredKeys:
            - "methods"
            - "research_results"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-TECH-SUMMARY-20"
        changeNote: "ارتقا به خروجی JSON منطبق با فیلدهای الزامی لایه ۲ در layers.yaml"

  - promptId: "PRM-EXEC-SUM"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "executive_managerial_summary"
    targetModelId: "diba-base"
    systemTemplate: "تو مشاور گزارش‌دهی مدیریتی و راهبردی در ساختار سلسله‌مراتبی سازمان هستی. جزئیات فنی سطح پایین را حذف کن و بر دستاوردهای کلیدی، ریسک‌های بحرانی، مسائل حل‌نشده و پیشنهادهای راهبردی تمرکز کن."
    userTemplate: "گره گزارش‌دهنده: {{node_id}}\nلایه هدف: {{target_layer}}\nسطح جزئیات: {{detail_level}}\nداده‌های ورودی:\n{{raw_report}}"
    requiredVariables:
      - "node_id"
      - "target_layer"
      - "detail_level"
      - "raw_report"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "key_achievements"
        - "critical_risks"
        - "unresolved_issues"
        - "strategic_recommendations"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-EXEC-SUMMARY-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-16"
        systemTemplate: "گزارش مدیریتی کوتاه تهیه کن."
        userTemplate: "گزارش گره {{node_id}}:\n{{raw_report}}"
        requiredVariables:
          - "node_id"
          - "raw_report"
        expectedOutputFormat:
          format: "markdown"
          requiredKeys:
            - "key_achievements"
            - "critical_risks"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-EXEC-SUMMARY-20"
        changeNote: "افزودن کنترل لایه هدف و ساختار JSON استاندارد لایه ۰ و ۱"

  - promptId: "PRM-ISSUE-DEC"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "issue_decomposition"
    targetModelId: "diba-base"
    systemTemplate: "تو معمار تحلیل مسئله در هسته RAG آفلاین هستی. مسئله کلان را به زیرمسائل مستقل، قابل اقدام و دارای ترتیب نسبی مشخص تجزیه کن."
    userTemplate: "گره مالک: {{node_id}}\nعنوان و شرح مسئله والد:\n{{issue_description}}\nدانش مرتبط موجود:\n{{related_knowledge}}"
    requiredVariables:
      - "node_id"
      - "issue_description"
      - "related_knowledge"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "parent_issue_summary"
        - "sub_issues"
        - "relative_order_rationale"
    citationPolicy: "optional"
    judgeRubricId: "RUBRIC-ISSUE-DECOMP-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-17"
        systemTemplate: "مسئله زیر را به چند زیرمسئله تقسیم کن."
        userTemplate: "مسئله:\n{{issue_description}}"
        requiredVariables:
          - "issue_description"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "sub_issues"
        citationPolicy: "none"
        judgeRubricId: "RUBRIC-ISSUE-DECOMP-20"
        changeNote: "افزودن دانش مرتبط و توجیه ترتیب نسبی زیرمسائل"

  - promptId: "PRM-SUBISSUE-CMP"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "sub_issue_comparison"
    targetModelId: "diba-base"
    systemTemplate: "تو تحلیلگر مقایسه مسائل و تشخیص هم‌پوشانی معنایی هستی. زیرمسئله نامزد را با فهرست مسائل موجود مقایسه کرده و تکرار، شباهت یا وابستگی را مشخص کن."
    userTemplate: "زیرمسئله نامزد:\n{{candidate_sub_issue}}\nمسائل و زیرمسائل موجود در گره:\n{{existing_issues}}\nحد آستانه تشابه: {{similarity_threshold}}"
    requiredVariables:
      - "candidate_sub_issue"
      - "existing_issues"
      - "similarity_threshold"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "is_duplicate"
        - "similar_issue_ids"
        - "similarity_score"
        - "recommendation"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-DEFAULT-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-17"
        systemTemplate: "دو مسئله زیر را از نظر تشابه مقایسه کن."
        userTemplate: "مسئله جدید: {{candidate_sub_issue}}\nمسائل قبلی: {{existing_issues}}"
        requiredVariables:
          - "candidate_sub_issue"
          - "existing_issues"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "is_duplicate"
            - "similar_issue_ids"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-DEFAULT-20"
        changeNote: "افزودن پارامتر similarity_threshold و توصیه ادغام یا حفظ"

  - promptId: "PRM-EXEC-ANL"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "executor_expertise_analysis"
    targetModelId: "diba-base"
    systemTemplate: "تو متخصص نگاشت توانمندی مجریان در مدل Issue-Knowledge-Executor هستی. بر اساس پروفایل پرسنلی و سوابق پروژه، بهترین مجریان را برای حل مسئله پیشنهاد بده."
    userTemplate: "مشخصات مسئله:\n{{issue_details}}\nپروفایل مجریان نامزد:\n{{executor_profiles}}\nسوابق دانش و پروژه:\n{{project_records}}"
    requiredVariables:
      - "issue_details"
      - "executor_profiles"
      - "project_records"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "recommended_executors"
        - "expertise_match_rationale"
        - "identified_skill_gaps"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-EXECUTOR-MATCH-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-18"
        systemTemplate: "مجری مناسب برای مسئله را انتخاب کن."
        userTemplate: "مسئله: {{issue_details}}\nمجریان: {{executor_profiles}}"
        requiredVariables:
          - "issue_details"
          - "executor_profiles"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "recommended_executors"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-EXECUTOR-MATCH-20"
        changeNote: "افزودن سوابق پروژه و الزام ارجاع به شناسه پروفایل و سند"

  - promptId: "PRM-GAP-ID"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "research_gap_identification"
    targetModelId: "diba-base"
    systemTemplate: "تو تحلیلگر شکاف‌های پژوهشی و کمبود دانش سازمانی هستی. مسائلی که دانش پشتیبان کافی ندارند، منابع متعارض دارند یا در داوری رد شده‌اند را شناسایی و اولویت‌بندی کن."
    userTemplate: "گره سازمانی: {{node_id}}\nمسائل باز:\n{{open_issues}}\nپوشش دانش فعلی:\n{{knowledge_summary}}\nسوابق داوری ناموفق:\n{{failed_judgments}}"
    requiredVariables:
      - "node_id"
      - "open_issues"
      - "knowledge_summary"
      - "failed_judgments"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "research_gaps"
        - "priority_ranking"
        - "recommended_actions"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-DEFAULT-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-18"
        systemTemplate: "شکاف‌های پژوهشی گره را فهرست کن."
        userTemplate: "مسائل باز: {{open_issues}}\nدانش موجود: {{knowledge_summary}}"
        requiredVariables:
          - "open_issues"
          - "knowledge_summary"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "research_gaps"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-DEFAULT-20"
        changeNote: "افزودن ورودی failed_judgments و رتبه‌بندی اولویت"

  - promptId: "PRM-TRANSFER-PREP"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "knowledge_transfer_prep"
    targetModelId: "diba-base"
    systemTemplate: "تو هماهنگ‌کننده انتقال دانش بین‌لایه‌ای در هسته RAG آفلاین هستی. بسته دانشی گره مبدأ را مطابق قواعد لایه مقصد و فیلدهای الزامی تنظیم و پالایش کن."
    userTemplate: "گره مبدأ: {{node_id}}\nسطح جزئیات لایه مقصد: {{detail_level}}\nفیلدهای الزامی قاعده لایه: {{required_fields}}\nپیش‌نویس دانش و مسائل گره:\n{{draft_payload}}"
    requiredVariables:
      - "node_id"
      - "detail_level"
      - "required_fields"
      - "draft_payload"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "node_id"
        - "detail_level"
        - "key_achievements"
        - "unresolved_issues"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-TRANSFER-PACKAGE-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-19"
        systemTemplate: "بسته انتقال دانش به لایه بالاتر را آماده کن."
        userTemplate: "گره: {{node_id}}\nپیش‌نویس:\n{{draft_payload}}"
        requiredVariables:
          - "node_id"
          - "draft_payload"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "node_id"
            - "key_achievements"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-TRANSFER-PACKAGE-20"
        changeNote: "افزودن فیلدهای الزامی لایه مقصد و سطح جزئیات"

  - promptId: "PRM-RFP-GEN"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "rfp_generation"
    targetModelId: "diba-base"
    systemTemplate: "تو نگارنده تخصصی اسناد اعلام نیاز (RFP) در سامانه مدیریت دانش هستی. بر اساس شرح مسئله، زیرمسائل و شکاف‌های پژوهشی، یک پیش‌نویس کامل RFP با تمام بخش‌های الزامی تولید کن."
    userTemplate: "شناسه و شرح مسئله منشأ:\n{{origin_issue}}\nزیرمسائل:\n{{sub_issues}}\nشکاف‌های پژوهشی و محدودیت‌ها:\n{{gaps_and_constraints}}"
    requiredVariables:
      - "origin_issue"
      - "sub_issues"
      - "gaps_and_constraints"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "title"
        - "problem_statement"
        - "scope"
        - "technical_requirements"
        - "expected_deliverables"
        - "evaluation_criteria"
        - "constraints"
        - "required_expertise"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-RFP-COMPLETENESS-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-20"
        systemTemplate: "یک سند RFP برای مسئله زیر بنویس."
        userTemplate: "مسئله:\n{{origin_issue}}"
        requiredVariables:
          - "origin_issue"
        expectedOutputFormat:
          format: "markdown"
          requiredKeys:
            - "title"
            - "problem_statement"
            - "scope"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-RFP-COMPLETENESS-20"
        changeNote: "تکمیل ۸ بخش اجباری ساختار RFP در قالب JSON"

  - promptId: "PRM-PROP-EVAL"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "proposal_evaluation"
    targetModelId: "diba-base"
    systemTemplate: "تو ارزیاب فنی پیشنهادهای دریافتی در برابر سند RFP هستی. انطباق فنی، امکان‌پذیری، مدیریت ریسک و پوشش الزامات اجباری پیشنهاد را به تفکیک هر معیار امتیازدهی کن."
    userTemplate: "الزامات و معیارهای سند RFP:\n{{rfp_criteria}}\nمحتوای پیشنهاد ثبت‌شده:\n{{proposal_content}}"
    requiredVariables:
      - "rfp_criteria"
      - "proposal_content"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "criteria_scores"
        - "total_score"
        - "meets_mandatory_requirements"
        - "feasibility_summary"
        - "source_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-PROPOSAL-EVAL-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-20"
        systemTemplate: "پیشنهاد زیر را بر اساس RFP ارزیابی کن."
        userTemplate: "RFP:\n{{rfp_criteria}}\nپیشنهاد:\n{{proposal_content}}"
        requiredVariables:
          - "rfp_criteria"
          - "proposal_content"
        expectedOutputFormat:
          format: "json"
          requiredKeys:
            - "total_score"
            - "meets_mandatory_requirements"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-PROPOSAL-EVAL-20"
        changeNote: "افزودن ریز امتیازات معیارها و ارجاعات بند به بند"

  - promptId: "PRM-FEEDBACK-GEN"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "feedback_generation"
    targetModelId: "diba-base"
    systemTemplate: "تو تولیدکننده گزارش بازخورد ساخت‌یافته برای پیشنهادهای RFP هستی. نقاط قوت، نقاط ضعف، نیازمندی‌های مفقود، ریسک‌های فنی و توصیه نهایی (select/revise/reject) را با ارجاع به معیارهای RFP استخراج کن."
    userTemplate: "سند RFP مرجع:\n{{rfp_reference}}\nخلاصه پیشنهاد:\n{{proposal_summary}}\nنتیجه ارزیابی معیارها:\n{{evaluation_summary}}"
    requiredVariables:
      - "rfp_reference"
      - "proposal_summary"
      - "evaluation_summary"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "strengths"
        - "weaknesses"
        - "missing_requirements"
        - "technical_risks"
        - "recommendation"
        - "criterion_references"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-FEEDBACK-20"
    history:
      - version: "0.9.0"
        lastUpdated: "2026-10-21"
        systemTemplate: "بازخورد پیشنهاد را بنویس."
        userTemplate: "پیشنهاد:\n{{proposal_summary}}\nارزیابی:\n{{evaluation_summary}}"
        requiredVariables:
          - "proposal_summary"
          - "evaluation_summary"
        expectedOutputFormat:
          format: "markdown"
          requiredKeys:
            - "strengths"
            - "weaknesses"
            - "recommendation"
        citationPolicy: "optional"
        judgeRubricId: "RUBRIC-FEEDBACK-20"
        changeNote: "الزام ارجاع به معیارهای RFP در فیلد criterion_references"

  - promptId: "PRM-JUDGE"
    version: "1.0.0"
    lastUpdated: "2026-10-29"
    taskType: "llm_as_judge"
    targetModelId: "diba-base"
    systemTemplate: "تو داور کنترل کیفیت (LLM-as-a-Judge) در هسته RAG سلسله‌مراتبی آفلاین هستی. خروجی تولیدشده را با دانش منبع، درخواست کاربر و چارچوب ۲۰ امتیازی مقایسه و امتیازدهی کن."
    userTemplate: "دانش منبع:\n{{source_knowledge}}\nدرخواست یا قاعده لایه:\n{{request_or_rule}}\nخروجی تولیدشده جهت داوری:\n{{candidate_output}}\nحد نصاب قبولی: {{threshold}}"
    requiredVariables:
      - "source_knowledge"
      - "request_or_rule"
      - "candidate_output"
      - "threshold"
    expectedOutputFormat:
      format: "json"
      requiredKeys:
        - "score"
        - "passed"
        - "explanation"
        - "missing_information"
        - "unsupported_claims"
    citationPolicy: "strict_source_id"
    judgeRubricId: "RUBRIC-DEFAULT-20"
    history:
      - version: "0.9.0"
