# قواعد انتقال دانش بین لایه‌های سازمانی (فاز ۱ - نهایی‌شده در فاز ۱۴)

version: "0.1.2-phase1"
last_updated: "2026-10-29"

maxLengthUnit: "characters"
layer_transfer_rules:
  - targetLayerIndex: 0
    usageScope: "upward_transfer"
    detailLevel: "executive_high"
    requiredFields:
      - "key_achievements"
      - "critical_risks"
      - "unresolved_issues"
      - "strategic_recommendations"
    maxLength: 2000
    minJudgeScore: 18

  - targetLayerIndex: 1
    usageScope: "upward_transfer"
    detailLevel: "managerial"
    requiredFields:
      - "project_status"
      - "issue_status"
      - "research_gaps"
      - "resource_needs"
      - "rfp_status"
    maxLength: 4000
    minJudgeScore: 18

  - targetLayerIndex: 2
    usageScope: "upward_transfer"
    detailLevel: "technical_summary"
    requiredFields:
      - "methods"
      - "research_results"
      - "limitations"
      - "executor_capabilities"
    maxLength: 8000
    minJudgeScore: 18

  # لایه ۴ صرفاً منبع دانش است (KNOWLEDGE_SOURCE) و بسته انتقال به بالا ارسال نمی‌کند (طبق R-08).
  # بنابراین قاعده targetLayerIndex: 3 برای گزارش‌های فنی تفصیلی درون‌لایه ۳ یا ممیزی فنی استفاده می‌شود
  # و با قاعده R-07 در nodes.yaml تعارضی ندارد.
  - targetLayerIndex: 3
    usageScope: "intra_layer_or_audit"
    detailLevel: "technical_detailed"
    requiredFields:
      - "full_issue_details"
      - "source_references"
      - "sub_issue_status"
      - "executor_mapping"
      - "evidence"
    maxLength: 20000
    minJudgeScore: 18
