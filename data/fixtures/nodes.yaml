# رجیستری اولیه گره‌های سازمانی (فاز ۱)
# این فایل قابل ویرایش است و فهرست نهایی در مرحله تعریف مطالعه موردی تثبیت می‌شود.
#
# قواعد گزارش‌دهی (فیلدهای الزامی، سطح جزئیات، حداکثر طول، حد امتیاز) فقط در layers.yaml تعریف می‌شوند.
# هر گره با transfer.ruleLayerIndex به قاعده مربوط اشاره می‌کند و فقط فیلدهای اضافه خاص خود را اینجا می‌آورد.
# گیرنده بسته همیشه parentNodeId است.

version: "0.1.1-phase1"
last_updated: "2026-10-29"

layers:
  - layerIndex: 0
    name: "لایه راهبردی"
    description: "مرجع عالی تصمیم‌گیری یا مالک کلان ساختار سازمانی"
    required: true
  - layerIndex: 1
    name: "سازمان‌های مادر"
    description: "شرکت‌ها یا سازمان‌های اصلی"
    required: true
  - layerIndex: 2
    name: "زیرمجموعه‌ها و واحدهای تخصصی"
    description: "شرکت‌های تابعه، مراکز پژوهشی، واحدهای مهندسی"
    required: true
  - layerIndex: 3
    name: "پروژه‌ها، تیم‌ها و گره‌های اجرایی"
    description: "تیم‌های پروژه، واحدهای پیاده‌سازی، گروه‌های پژوهشی"
    required: true
  - layerIndex: 4
    name: "منابع داخلی دانش"
    description: "کتابخانه‌ها، آرشیوها، مخازن محلی"
    required: false

nodes:
  - nodeId: "N-000"
    name: "مرجع راهبردی نمونه"
    layerIndex: 0
    parentNodeId: null
    activityDomain: "راهبری کلان"
    boundaryType: "ROOT"
    confidentiality: "internal"
    transfer: null

  - nodeId: "N-100"
    name: "سازمان مادر الف"
    layerIndex: 1
    parentNodeId: "N-000"
    activityDomain: "فناوری اطلاعات"
    boundaryType: "INTERMEDIATE"
    confidentiality: "internal"
    transfer:
      ruleLayerIndex: 0
      extraRequiredFields:
        - "risks"
        - "achievements"

  - nodeId: "N-200"
    name: "مرکز پژوهشی ب"
    layerIndex: 2
    parentNodeId: "N-100"
    activityDomain: "پژوهش نرم‌افزار"
    boundaryType: "INTERMEDIATE"
    confidentiality: "internal"
    transfer:
      ruleLayerIndex: 1
      extraRequiredFields: []

  - nodeId: "N-300"
    name: "تیم پروژه پ"
    layerIndex: 3
    parentNodeId: "N-200"
    activityDomain: "پیاده‌سازی RAG"
    boundaryType: "INTERMEDIATE"
    confidentiality: "restricted"
    transfer:
      ruleLayerIndex: 2
      extraRequiredFields:
        - "test_notes"

  - nodeId: "N-301"
    name: "تیم پژوهشی ت"
    layerIndex: 3
    parentNodeId: "N-200"
    activityDomain: "پژوهش مدل کوچک"
    boundaryType: "LEAF"
    confidentiality: "restricted"
    transfer:
      ruleLayerIndex: 2
      extraRequiredFields:
        - "research_notes"

  - nodeId: "N-400"
    name: "آرشیو اسناد محلی"
    layerIndex: 4
    parentNodeId: "N-200"
    activityDomain: "مخزن دانش"
    boundaryType: "KNOWLEDGE_SOURCE"
    confidentiality: "internal"
    transfer: null

validation_rules:
  - id: "R-01"
    description: "هر گره دقیقاً یک لایه اصلی معتبر دارد"
  - id: "R-02"
    description: "هر گره (به‌جز ریشه) دقیقاً یک گره والد دارد"
  - id: "R-03"
    description: "LayerIndex گره والد باید کوچک‌تر از LayerIndex فرزند باشد (والد همیشه در لایه بالاتر است)"
  - id: "R-04"
    description: "گره Leaf نمی‌تواند فرزند داشته باشد"
  - id: "R-05"
    description: "حوزه فعالیت الزامی و غیرخالی است"
  - id: "R-06"
    description: "هر لایه (به‌جز لایه ۴) حداقل یک گره دارد"
  - id: "R-07"
    description: "اگر transfer مقدار دارد، ruleLayerIndex باید برابر LayerIndex گره منهای ۱ باشد و قاعده متناظر در layers.yaml وجود داشته باشد"
  - id: "R-08"
    description: "گره ROOT و گره KNOWLEDGE_SOURCE مقدار transfer برابر null دارند؛ سایر گره‌ها باید transfer معتبر داشته باشند"